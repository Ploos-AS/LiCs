name: CI

on:
  push:
  pull_request:

jobs:
  standalone-contract:
    runs-on: ubuntu-latest
    env:
      LICS_PBMP_SOCKET: ""
      LICS_BOTWEB_URL: ""
      LICS_BOTAI_URL: ""
      LICS_BOTLOGIC_URL: ""
    steps:
      - uses: actions/checkout@v4
      - name: Qualify standalone core with all integrations disabled
        run: |
          test -z "$LICS_PBMP_SOCKET"
          test -z "$LICS_BOTWEB_URL"
          test -z "$LICS_BOTAI_URL"
          test -z "$LICS_BOTLOGIC_URL"
          make test

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core and fallback tests
        run: make test

  tinyscheme-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned TinyScheme 1.42
        run: |
          mkdir -p vendor
          curl -L --fail --retry 3 -o /tmp/tinyscheme-1.42.tar.gz "https://sourceforge.net/projects/tinyscheme/files/tinyscheme/tinyscheme-1.42/tinyscheme-1.42.tar.gz/download"
          tar -xzf /tmp/tinyscheme-1.42.tar.gz -C vendor
          test -f vendor/tinyscheme-1.42/scheme.c
      - name: Real TinyScheme VM tests
        run: make test-tinyscheme
